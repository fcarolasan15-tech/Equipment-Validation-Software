version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./templates:/app/templates
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///./evs.db
      - VAULT_ROOT=/app/templates
      - STORAGE_ROOT=/app/storage
    depends_on:
      - libreoffice

  libreoffice:
    image: linuxserver/libreoffice:latest
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
